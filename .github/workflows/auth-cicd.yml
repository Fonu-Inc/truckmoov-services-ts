name: Services CI/CD

on:
  pull_request:
    paths:
      - "apps/auth/**"
      - "apps/fleet/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "Dockerfile.fleet"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".env.example"
      - ".github/workflows/auth-cicd.yml"
      - "deploy/**"
  push:
    branches:
      - main
    paths:
      - "apps/auth/**"
      - "apps/fleet/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "Dockerfile.fleet"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".env.example"
      - ".github/workflows/auth-cicd.yml"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: services-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test services
        run: pnpm test

      - name: Build services
        run: pnpm build

  deploy-auth-dev:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Render service kustomize bundles
        env:
          AUTH_IMAGE_NAME: truckmoov-auth
          FLEET_IMAGE_NAME: truckmoov-fleet
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          rm -rf deploy/.rendered/auth deploy/.rendered/fleet
          mkdir -p deploy/.rendered
          cp -R deploy/k8s/auth deploy/.rendered/auth
          cp -R deploy/k8s/fleet deploy/.rendered/fleet
          sed -i "s|newName: .*|newName: ${AUTH_IMAGE_NAME}|" deploy/.rendered/auth/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/.rendered/auth/kustomization.yaml
          sed -i "s|newName: .*|newName: ${FLEET_IMAGE_NAME}|" deploy/.rendered/fleet/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/.rendered/fleet/kustomization.yaml

      - name: Show rendered service bundles
        run: find deploy/.rendered -maxdepth 3 -type f | sort

      - name: Prepare SSH access
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEV_SSH_KEY" >"$RUNNER_TEMP/dev_ssh_key"
          chmod 600 "$RUNNER_TEMP/dev_ssh_key"
          ssh-keyscan -H "$DEV_SSH_HOST" >>"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync source to deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEPLOY_PATH: /var/www/truckmoov-services-ts
          SOURCE_PATH: /var/www/truckmoov-services-ts/source/${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$DEPLOY_PATH\" ] || mkdir -p \"$DEPLOY_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$SOURCE_PATH\" ] || mkdir -p \"$SOURCE_PATH\""
          git archive --format=tar HEAD | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xf - -C \"$SOURCE_PATH\""

      - name: Copy service manifests to deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEPLOY_PATH: /var/www/truckmoov-services-ts
          AUTH_MANIFEST_PATH: /var/www/truckmoov-services-ts/rendered/${{ github.sha }}/auth
          FLEET_MANIFEST_PATH: /var/www/truckmoov-services-ts/rendered/${{ github.sha }}/fleet
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$DEPLOY_PATH\" ] || mkdir -p \"$DEPLOY_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$AUTH_MANIFEST_PATH\" ] || mkdir -p \"$AUTH_MANIFEST_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$FLEET_MANIFEST_PATH\" ] || mkdir -p \"$FLEET_MANIFEST_PATH\""
          tar -C deploy/.rendered/auth -czf - . | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xzf - -C \"$AUTH_MANIFEST_PATH\""
          tar -C deploy/.rendered/fleet -czf - . | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xzf - -C \"$FLEET_MANIFEST_PATH\""

      - name: Verify deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" '
            set -eu
            command -v docker >/dev/null 2>&1
            kubectl config current-context
          '

      - name: Build auth image
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          AUTH_IMAGE: truckmoov-auth:sha-${{ github.sha }}
          SOURCE_PATH: /var/www/truckmoov-services-ts/source/${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "DOCKER_BUILDKIT=0 docker build -f \"$SOURCE_PATH/Dockerfile.auth\" -t \"$AUTH_IMAGE\" \"$SOURCE_PATH\""

      - name: Build fleet image
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          FLEET_IMAGE: truckmoov-fleet:sha-${{ github.sha }}
          SOURCE_PATH: /var/www/truckmoov-services-ts/source/${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "DOCKER_BUILDKIT=0 docker build -f \"$SOURCE_PATH/Dockerfile.fleet\" -t \"$FLEET_IMAGE\" \"$SOURCE_PATH\""

      - name: Import images into k3s
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          AUTH_IMAGE: truckmoov-auth:sha-${{ github.sha }}
          FLEET_IMAGE: truckmoov-fleet:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            docker save \"$AUTH_IMAGE\" | sudo -n /usr/local/bin/k3s ctr images import -
            docker save \"$FLEET_IMAGE\" | sudo -n /usr/local/bin/k3s ctr images import -
          "

      - name: Deploy services
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          AUTH_MANIFEST_PATH: /var/www/truckmoov-services-ts/rendered/${{ github.sha }}/auth
          FLEET_MANIFEST_PATH: /var/www/truckmoov-services-ts/rendered/${{ github.sha }}/fleet
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            set -eu
            kubectl apply --validate=false -k \"$AUTH_MANIFEST_PATH\"
            kubectl apply --validate=false -k \"$FLEET_MANIFEST_PATH\"
            kubectl rollout status deployment/auth-service -n truckmoov --timeout=300s || {
              kubectl describe deployment auth-service -n truckmoov
              kubectl logs -n truckmoov -l app.kubernetes.io/name=auth-service --all-containers --tail=200
              kubectl get events -n truckmoov --sort-by=.metadata.creationTimestamp | tail -n 50
              exit 1
            }
            kubectl rollout status deployment/fleet-service -n truckmoov --timeout=300s || {
              kubectl describe deployment fleet-service -n truckmoov
              kubectl logs -n truckmoov -l app.kubernetes.io/name=fleet-service --all-containers --tail=200
              kubectl get events -n truckmoov --sort-by=.metadata.creationTimestamp | tail -n 50
              exit 1
            }
          "
