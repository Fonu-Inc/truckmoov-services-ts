name: Services CI/CD

on:
  pull_request:
    paths:
      - "apps/auth/**"
      - "apps/fleet/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "Dockerfile.fleet"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".env.example"
      - ".github/workflows/auth-cicd.yml"
      - "deploy/**"
  push:
    branches:
      - main
    paths:
      - "apps/auth/**"
      - "apps/fleet/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "Dockerfile.fleet"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".env.example"
      - ".github/workflows/auth-cicd.yml"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: services-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test services
        run: pnpm test

      - name: Build services
        run: pnpm build

  publish:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: Dockerfile.auth
          - service: fleet
            dockerfile: Dockerfile.fleet
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fonu-inc/truckmoov-${{ matrix.service }}:sha-${{ github.sha }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Fonu-Inc/truckmoov-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tags
        run: |
          set -euo pipefail
          for service in auth fleet; do
            (cd gitops/manifests/$service && kustomize edit set image "ghcr.io/fonu-inc/truckmoov-${service}:sha-${GIT_SHA}")
          done
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git diff --quiet && exit 0
          git commit -am "chore: bump ts services to sha-${GIT_SHA}"
          git push
