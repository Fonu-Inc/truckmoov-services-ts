name: Auth CI/CD

on:
  pull_request:
    paths:
      - "apps/auth/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/auth-cicd.yml"
      - "deploy/k8s/auth/**"
  push:
    branches:
      - main
    paths:
      - "apps/auth/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/auth-cicd.yml"
      - "deploy/k8s/auth/**"
  workflow_dispatch:

concurrency:
  group: auth-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/truckmoov-auth

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:auth

      - name: Test auth
        run: pnpm test:auth

      - name: Build auth
        run: pnpm build:auth

  publish-auth-image:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - id: image_tag
        name: Capture immutable auth image tag
        run: echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auth
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-auth-dev:
    runs-on: ubuntu-latest
    needs: publish-auth-image
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Render auth kustomize bundle
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.publish-auth-image.outputs.image_tag }}
        run: |
          rm -rf deploy/.rendered/auth
          mkdir -p deploy/.rendered
          cp -R deploy/k8s/auth deploy/.rendered/auth
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" deploy/.rendered/auth/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/.rendered/auth/kustomization.yaml

      - name: Show rendered auth bundle
        run: find deploy/.rendered/auth -maxdepth 2 -type f | sort

      - name: Copy auth manifests to deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          AUTH_DEPLOY_PATH: /var/www/truckmoov-services-ts/auth
        run: |
          set -eu
          SSH_KEY_PATH="$RUNNER_TEMP/dev_deploy_key"
          KNOWN_HOSTS_PATH="$RUNNER_TEMP/dev_known_hosts"
          trap 'rm -f "$SSH_KEY_PATH" "$KNOWN_HOSTS_PATH"' EXIT

          printf '%s\n' "$DEV_SSH_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          ssh-keyscan -H "$DEV_SSH_HOST" > "$KNOWN_HOSTS_PATH"
          chmod 644 "$KNOWN_HOSTS_PATH"

          ssh -i "$SSH_KEY_PATH" -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=yes "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "rm -rf \"$AUTH_DEPLOY_PATH\" && mkdir -p \"$AUTH_DEPLOY_PATH\""

          tar -C deploy/.rendered/auth -czf - . | \
            ssh -i "$SSH_KEY_PATH" -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=yes "$DEV_SSH_USER@$DEV_SSH_HOST" \
              "tar -xzf - -C \"$AUTH_DEPLOY_PATH\""

      - name: Apply auth deployment over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AUTH_DEPLOY_PATH: /var/www/truckmoov-services-ts/auth
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: true
          envs: AUTH_DEPLOY_PATH
          script: |
            set -eu
            kubectl apply --validate=false -k "$AUTH_DEPLOY_PATH"
            if ! kubectl rollout status deployment/auth-service -n truckmoov --timeout=300s; then
              kubectl get deployment auth-service -n truckmoov -o wide || true
              kubectl get pods -n truckmoov -l app.kubernetes.io/name=auth-service -o wide || true
              kubectl describe deployment auth-service -n truckmoov || true
              kubectl describe pods -n truckmoov -l app.kubernetes.io/name=auth-service || true
              kubectl logs -n truckmoov -l app.kubernetes.io/name=auth-service --all-containers --tail=200 || true
              kubectl get events -n truckmoov --sort-by=.metadata.creationTimestamp | tail -n 50 || true
              exit 1
            fi
