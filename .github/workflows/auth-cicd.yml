name: Services CI/CD

on:
  pull_request:
    paths:
      - "apps/auth/**"
      - "apps/fleet/**"
      - "apps/realtime/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "Dockerfile.realtime"
      - "Dockerfile.fleet"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".env.example"
      - ".github/workflows/auth-cicd.yml"
      - ".trivyignore"
      - "deploy/**"
  push:
    branches:
      - main
    paths:
      - "apps/auth/**"
      - "apps/fleet/**"
      - "apps/realtime/**"
      - "libs/shared/**"
      - "tests/**"
      - "Dockerfile.auth"
      - "Dockerfile.realtime"
      - "Dockerfile.fleet"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".env.example"
      - ".github/workflows/auth-cicd.yml"
      - ".trivyignore"
      - "deploy/**"
  workflow_dispatch:
  # Weekly re-scan catches CVEs published after the last merge; only security runs.
  schedule:
    - cron: "0 6 * * 1"

# A run on main ships only the services it changed, so a newer push must not
# cancel it: that would drop its deploy. Each main run gets its own group.
concurrency:
  group: services-cicd-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            auth:
              - "apps/auth/**"
              - "Dockerfile.auth"
              - "tests/*/auth/**"
            fleet:
              - "apps/fleet/**"
              - "Dockerfile.fleet"
              - "tests/*/fleet/**"
            realtime:
              - "apps/realtime/**"
              - "Dockerfile.realtime"
              - "tests/*/realtime/**"
            shared:
              - "libs/**"
              - "tests/unit/shared/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "nest-cli.json"
              - ".env.example"
              - "deploy/**"
              - ".github/workflows/auth-cicd.yml"

      # Shared code, or a manual run, touches every service; otherwise only the
      # services whose own files changed.
      - name: Services to test and ship
        id: services
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || echo "$CHANGED" | jq -e 'index("shared")' > /dev/null; then
            services='["auth","fleet","realtime"]'
          else
            services=$(echo "$CHANGED" | jq -c '[.[] | select(. != "shared")]')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services: $services"

  validate:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ${{ matrix.service }}
        run: pnpm lint:${{ matrix.service }}

      - name: Test ${{ matrix.service }}
        run: pnpm test:${{ matrix.service }}

      - name: Build ${{ matrix.service }}
        run: pnpm build:${{ matrix.service }}

  # Whole-repo checks no single service owns: the type check covers every app at
  # once, and the shared tests load the auth and fleet modules together.
  check:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Shared tests
        run: pnpm test:shared

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 9.15.0

      - name: pnpm audit (report only)
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Trivy dependency scan (HIGH/CRITICAL, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Dockerfile / IaC misconfig scan.
      - name: Trivy config scan (critical, report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"

      - name: Trivy config scan (high report)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

  publish:
    runs-on: ubuntu-latest
    needs: [changes, validate, check, security]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fonu-inc/truckmoov-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Blocks update-gitops, so an image with a known HIGH/CRITICAL CVE is never deployed.
      - name: Trivy image scan (HIGH/CRITICAL, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/fonu-inc/truckmoov-${{ matrix.service }}:sha-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  update-gitops:
    runs-on: ubuntu-latest
    needs: [changes, publish]
    permissions:
      contents: read
    env:
      GIT_SHA: ${{ github.sha }}
      SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Fonu-Inc/truckmoov-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0

      - name: Bump image tags
        run: |
          set -euo pipefail
          # Only the services published in this run have an image at this tag.
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            (cd gitops/manifests/$service && kustomize edit set image "ghcr.io/fonu-inc/truckmoov-${service}:sha-${GIT_SHA}")
          done
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git diff --quiet && exit 0
          git commit -am "chore: bump ts services to sha-${GIT_SHA}"
          # Runs on main no longer cancel each other, so another bump may land first.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
