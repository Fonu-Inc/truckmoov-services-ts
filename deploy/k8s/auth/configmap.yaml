apiVersion: v1
kind: ConfigMap
metadata:
  name: truckmoov-auth-config
data:
  NODE_ENV: production
  AUTH_PORT: "3001"
  PERSISTENCE_BACKEND: mikro-orm
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: truckmoov
  POSTGRES_DB: truckmoov
  NATS_URL: nats://nats:4222
  NATS_STREAM: truckmoov_events
  DEFAULT_TENANT: default
  MAIL_TRANSPORT: "null"
  DOTGO_BASE_URL: https://konnect.dotgo.com
  DOTGO_TRANSACTIONAL_SENDER_MASK: FONU
  OTP_DEDUP_WINDOW_S: "45"
  MTN_API_BASE_URL: https://preprod2-nigeria.api.mtn.com
  MTN_M2M_NODE_ID: MTNAPPNXG
  MTN_COUNTRY_CODE: NGA
  MTN_M2M_PRODUCT_MATCH: m2m|machine
  MTN_API_TIMEOUT_MS: "15000"
  MTN_BUNDLE_SYNC_ENABLED: "true"
  MTN_BUNDLE_SYNC_INTERVAL_MINUTES: "360"
  SENTRY_ENVIRONMENT: production
