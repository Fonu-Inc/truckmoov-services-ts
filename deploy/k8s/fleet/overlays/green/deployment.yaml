apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service-green
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: fleet-service
    app.kubernetes.io/component: backend
    truckmoov.track: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-service
      truckmoov.track: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-service
        app.kubernetes.io/component: backend
        truckmoov.track: green
    spec:
      containers:
        - name: fleet-service
          image: fleet-image
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: truckmoov-fleet-config
            - secretRef:
                name: truckmoov-fleet-secrets
                optional: false
          readinessProbe:
            httpGet:
              path: /fleet/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /fleet/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
